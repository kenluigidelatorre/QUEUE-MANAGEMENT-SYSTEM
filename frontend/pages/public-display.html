<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Public Live Display — IDS Colleges</title>
    <meta
      name="description"
      content="Live public queue monitor showing currently served and upcoming student numbers at IDS Colleges."
    />
    <link rel="icon" type="image/png" href="../assets/images/favicon.png" />

    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Typography & Project Stylesheets -->
    <link rel="stylesheet" href="../assets/fonts/manrope.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body class="page-display" data-page="display">
    <!-- Top Sticky Navigation -->
    <header class="ids-header">
      <nav class="navbar navbar-expand-lg py-0" aria-label="Primary navigation">
        <div class="container-xl ids-header-inner px-3 px-lg-4">
          <a href="../index.html" class="brand-lockup" aria-label="Go to home">
            <img
              src="../assets/images/ids-colleges-logo.png"
              alt="IDS Colleges official seal"
              class="brand-seal"
            />
            <div>
              <p class="brand-title">IDS COLLEGES</p>
              <p class="brand-subtitle">INFOTECH DEVELOPMENT SYSTEM</p>
            </div>
          </a>

          <button
            class="navbar-toggler border-0 shadow-none"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#idsMainNav"
            aria-controls="idsMainNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse justify-content-end" id="idsMainNav">
            <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-1 gap-lg-2 py-2 py-lg-0">
              <a href="./student-queue.html" class="ids-nav-link" data-nav-page="student">
                <i class="bi bi-person"></i>
                <span>Student Queue</span>
              </a>
              <a href="./staff-login.html" class="ids-nav-link" data-nav-page="login">
                <i class="bi bi-shield-check"></i>
                <span>Staff Login</span>
              </a>
              <a href="./public-display.html" class="ids-nav-link active" data-nav-page="display">
                <i class="bi bi-display"></i>
                <span>Public Display</span>
              </a>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <!-- Main Public Display Board -->
    <main class="main-viewport py-4 py-lg-5 px-3 px-lg-4">
      <div class="container-xxl">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
          <div>
            <p
              class="mb-0 text-uppercase fw-bold"
              style="font-size: 0.75rem; letter-spacing: 0.2em; color: #86efac;"
            >
              IDS Colleges
            </p>
            <h1 class="mt-1 mb-0 fw-extrabold text-white" style="font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 800;">
              Student Services Queue
            </h1>
          </div>

          <div class="d-flex flex-wrap align-items-center gap-2">
            <div
              id="publicAnnouncementStatus"
              class="d-inline-flex align-items-center gap-2 rounded-pill px-3 py-2 fw-bold"
              style="background-color: rgba(255, 255, 255, 0.1); font-size: 0.75rem; color: #dcfce7;"
            >
              <span class="status-dot-emerald" style="background-color: #94a3b8;" aria-hidden="true"></span>
              <span>Announcement: Standby</span>
            </div>

            <div
              class="d-inline-flex align-items-center gap-2 rounded-pill px-3 py-2 fw-bold"
              style="background-color: rgba(255, 255, 255, 0.1); font-size: 0.75rem; color: #dcfce7;"
            >
              <span class="status-dot-emerald status-dot-pulse" style="background-color: #34d399;" aria-hidden="true"></span>
              <span>Live queue</span>
            </div>
          </div>
        </div>

        <!-- 2-Column Office Monitor Cards (Hydrated by interactions.js) -->
        <div id="publicDisplayGrid" class="row g-4 mt-2"></div>

        <p class="mt-4 mb-0 text-center" style="font-size: 0.75rem; color: rgba(187, 247, 208, 0.72);">
          Please wait for your queue number to be called. Keep your ticket ready.
        </p>
      </div>
    </main>

    <!-- Bootstrap 5 Bundle & Application Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="../js/api/api.js" defer></script>
    <script src="../js/services/queueService.js" defer></script>
    <script src="../js/services/authService.js" defer></script>
    <script src="../js/voiceAnnouncement.js" defer></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/navigation.js" defer></script>
    <script src="../js/validation.js" defer></script>
    <script src="../js/interactions.js" defer></script>
  </body>
</html>
